name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, migrations, and tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GEARWATCH_APP_ENV: test
      GEARWATCH_DEBUG: "false"
      GEARWATCH_DATABASE_URL: postgresql+psycopg://gearwatch:gearwatch@localhost:5432/gearwatch_test
      GEARWATCH_TEST_DATABASE_URL: postgresql+psycopg://gearwatch:gearwatch@localhost:5432/gearwatch_test
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: gearwatch_test
          POSTGRES_USER: gearwatch
          POSTGRES_PASSWORD: gearwatch
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gearwatch -d gearwatch_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run Ruff
        run: ruff check app migrations tests

      - name: Validate database migrations
        run: |
          alembic upgrade head
          alembic check

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run automated test suite
        run: |
          mkdir -p test-results
          pytest -p no:cacheprovider \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=90 \
            --junitxml=test-results/pytest.xml

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-${{ github.run_attempt }}
          path: |
            coverage.xml
            test-results/pytest.xml
          if-no-files-found: warn
          retention-days: 14

  container:
    name: Build and smoke-test containers
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate Compose configuration
        run: |
          docker compose config --quiet
          docker compose --profile collection config --quiet

      - name: Build and start containers
        run: docker compose up -d --build --wait --wait-timeout 120

      - name: Smoke-test containerized application
        run: |
          curl --fail --silent --show-error http://127.0.0.1:8000/health
          curl --fail --silent --show-error --output /dev/null http://127.0.0.1:8000/
          docker compose exec -T app alembic current

      - name: Verify safe scheduler default
        run: |
          set +e
          GEARWATCH_CATALOG_DISCOVERY_ENABLED=false docker compose --profile collection run --rm collector
          scheduler_status=$?
          set -e
          test "$scheduler_status" -eq 2

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop containers
        if: always()
        run: docker compose down --volumes
